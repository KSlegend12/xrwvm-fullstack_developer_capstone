services:
  - type: web
    name: fullstack-car-dealership-capstone
    env: python
    region: oregon
    plan: free
    buildCommand: |
      pip install -r server/requirements.txt
      python -c "import nltk; nltk.download('vader_lexicon')"
      cd server/frontend && npm install && npm run build && cd ../..
      python server/manage.py migrate --noinput
      python -c "import os, django; os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'djangoproj.settings'); django.setup(); from djangoapp.populate import initiate; initiate()"
      python server/manage.py collectstatic --noinput
    startCommand: cd server && gunicorn djangoproj.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9
