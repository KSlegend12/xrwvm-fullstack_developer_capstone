name: Dealership Capstone CI/CD Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-and-frontend-build-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r server/requirements.txt
        python -c "import nltk; nltk.download('vader_lexicon')"

    - name: Run Django System Checks and Migrations
      run: |
        python server/manage.py check
        python server/manage.py makemigrations --check --dry-run || python server/manage.py makemigrations djangoapp
        python server/manage.py migrate

    - name: Seed Database
      run: |
        cd server
        python -c "import os, django; os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'djangoproj.settings'); django.setup(); from djangoapp.populate import initiate; initiate()"

    - name: Run Django Backend Tests
      run: |
        cd server
        python manage.py test djangoapp

    - name: Set up Node.js 18.x
      uses: actions/setup-node@v4
      with:
        node-version: "18.x"
        cache: 'npm'
        cache-dependency-path: server/frontend/package-lock.json

    - name: Install Frontend Dependencies
      run: |
        cd server/frontend
        npm ci || npm install

    - name: Run Frontend Tests
      run: |
        cd server/frontend
        npm test -- --watchAll=false

    - name: Build React Frontend
      run: |
        cd server/frontend
        npm run build

    - name: Collect Static Assets
      run: |
        cd server
        python manage.py collectstatic --noinput
