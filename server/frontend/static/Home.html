<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dealerships - Home</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/bootstrap.min.css">
<script>
const logout = async (e) => {
  if (e) e.preventDefault();
  let logout_url = window.location.origin + "/djangoapp/logout";
  try {
    const res = await fetch(logout_url, { method: "GET" });
    const json = await res.json();
    let username = sessionStorage.getItem("username");
    sessionStorage.removeItem("username");
    sessionStorage.removeItem("firstname");
    sessionStorage.removeItem("lastname");
    alert("Logged out " + (username || "") + " successfully.");
    window.location.href = "/";
  } catch (err) {
    console.error("Logout error:", err);
    sessionStorage.clear();
    window.location.href = "/";
  }
};

let checkSession = () => {
  let curr_user = sessionStorage.getItem("username");
  let loginlogout = document.getElementById("loginlogout");
  if (!loginlogout) return;

  if (curr_user && curr_user !== "") {
    loginlogout.innerHTML = 
      '<span class="homepage_links me-3 fw-bold" style="color: #0b5368;">' + curr_user + '</span>' +
      '<a class="homepage_links btn btn-outline-danger btn-sm" onclick="logout(event)" href="#">Logout</a>';
  } else {
    loginlogout.innerHTML = 
      '<a class="homepage_links btn btn-outline-primary btn-sm me-2" href="/login">Login</a>' +
      '<a class="homepage_links btn btn-primary btn-sm" href="/register">Register</a>';
  }
};
</script>
</head>
<body onload="checkSession()">
<nav class="navbar navbar-expand-lg navbar-light" style="background-color:darkturquoise; height: 1in;">
  <div class="container-fluid">
    <h2 style="padding-right: 5%;">Dealerships</h2>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText" aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarText">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" style="font-size: larger;" aria-current="page" href="/">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" style="font-size: larger;" href="/about">About Us</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" style="font-size: larger;" href="/contact">Contact Us</a>
        </li>
      </ul>
      <span class="navbar-text">
        <div class="loginlink" id="loginlogout">
        </div>
      </span>
    </div>
  </div>
</nav>

<div style="display: flex; flex-direction: column; align-items: center; margin-bottom: 40px;">
  <div class="card shadow" style="width: 55%; margin-top: 40px; border-radius: 12px; overflow: hidden;">
    <img src="/static/car_dealership.jpg" class="card-img-top" alt="Car Dealership">
    <div class="banner text-center p-4">
      <h3 class="fw-bold mb-3" style="color: #0b5368;">Welcome to our Dealerships!</h3>
      <p class="text-muted">Explore authorized car dealerships across the United States, view detailed customer reviews, and submit your verified driver feedback.</p>
      <a href="/dealers" class="btn btn-info text-dark fw-bold px-4 py-2" style="background-color: aqua; border: none;">View Dealerships</a>
    </div>
  </div>
</div>
</body>
</html>
